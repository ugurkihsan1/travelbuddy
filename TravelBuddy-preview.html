",district:"Fatih",area:"Sultanahmet",side:"europe",category:"landmark",coordinate:{lat:41.0086,lng:28.9802},duration:60,color:"#c08b69",description:"A monumental meeting of Byzantine architecture and Ottoman history, still used as a mosque.",tip:"Foreign sightseeing visitors use the paid upper-gallery visitor route. Mosque access and sightseeing entry are different; follow the current signs and dress modestly.",entry:"Paid visitor-gallery ticket; access can change during worship.",bestTime:"Early morning"},{id:"topkapi-palace",name:"Topkapı Palace",district:"Fatih",area:"Sultanahmet",side:"europe",category:"museum",coordinate:{lat:41.0118,lng:28.983},duration:120,color:"#94a18b",closedDays:[2],description:"The Ottoman sultans’ palace: courtyards, imperial collections and views over the Bosphorus.",tip:"Closed on Tuesdays. Arrive early; allow extra time for security. Check which sections your ticket includes before buying.",entry:"Paid palace ticket; ticket bundles and Harem access vary.",bestTime:"At opening time"},{id:"grand-bazaar",name:"Grand Bazaar",district:"Fatih",area:"Beyazıt",side:"europe",category:"market",coordinate:{lat:41.0107,lng:28.968},duration:75,color:"#b19870",closedDays:[0],description:"A covered maze of historic lanes selling ceramics, textiles, jewellery and much more.",tip:"Closed on Sundays and some public holidays. Ask prices before committing, compare shops and keep your bag close in the busiest lanes.",entry:"Free to browse; shopping is optional.",bestTime:"Late morning or early afternoon"},{id:"hippodrome",name:"Hippodrome Square",district:"Fatih",area:"Sultanahmet",side:"europe",category:"landmark",coordinate:{lat:41.0061,lng:28.9756},duration:30,color:"#aba28d",description:"The former chariot-racing ground, with an Egyptian obelisk and the ancient Serpent Column.",tip:"A good open-air stop while nearby mosques pause visitor entry for prayers. Keep out of marked worship queues.",entry:"Free public square.",bestTime:"Morning or sunset"},{id:"gulhane-park",name:"Gülhane Park",district:"Fatih",area:"Sultanahmet",side:"europe",category:"park",coordinate:{lat:41.0136,lng:28.9814},duration:45,color:"#90a98b",description:"Leafy paths beside the palace walls, ideal for a quiet pause after sightseeing.",tip:"Bring water and enjoy the shaded paths; tulips are seasonal. This route uses the park’s public paths.",entry:"Free public park; observe posted opening hours.",bestTime:"Afternoon break"},{id:"archaeology-museums",name:"Istanbul Archaeology Museums",district:"Fatih",area:"Sultanahmet",side:"europe",category:"museum",coordinate:{lat:41.0116,lng:28.9813},duration:90,color:"#a79380",description:"Ancient sculpture, sarcophagi and archaeological collections beside Topkapı Palace.",tip:"Exhibition sections can close for conservation. Check the entrance notice and allow time for the collections that are currently open.",entry:"Paid museum ticket; some sections may have limited access.",bestTime:"Mid-morning"},{id:"spice-bazaar",name:"Spice Bazaar",district:"Fatih",area:"Eminönü",side:"europe",category:"market",coordinate:{lat:41.0165,lng:28.9705},duration:45,color:"#c49a67",description:"A compact historic market filled with spices, tea, sweets and fragrant food stalls.",tip:"Ask the price by weight before buying and sample only when offered. Surrounding streets are excellent for a simple lunch.",entry:"Free to browse; holiday hours can vary.",bestTime:"Late morning"},{id:"galata-bridge",name:"Galata Bridge",district:"Fatih / Beyoğlu",area:"Eminönü",side:"europe",category:"viewpoint",coordinate:{lat:41.0205,lng:28.9748},duration:30,color:"#8fa8aa",description:"Walk above the Golden Horn with fishing rods, ferries and old-city skylines in view.",tip:"Use the pavement on the upper deck. Check menu prices before sitting at the restaurants beneath the bridge.",entry:"Free pedestrian crossing.",bestTime:"Late afternoon"},{id:"karakoy",name:"Karaköy café streets",district:"Beyoğlu",area:"Karaköy",side:"europe",category:"food",coordinate:{lat:41.0244,lng:28.9786},duration:60,color:"#b18d76",description:"Coffee, bakeries and small shops between the ferry pier and Galata’s hillside.",tip:"Build in a lunch or coffee break. This is an area walk: choose a café that suits your budget and dietary needs.",entry:"Free area walk; food and drinks are extra.",bestTime:"Lunch or afternoon coffee"},{id:"galata-tower",name:"Galata Tower",district:"Beyoğlu",area:"Galata",side:"europe",category:"viewpoint",coordinate:{lat:41.0256,lng:28.9742},duration:60,color:"#b7a48a",description:"A medieval tower with panoramic views of the peninsula, Golden Horn and Bosphorus.",tip:"The streets uphill are steep. The square is free; buy a ticket only if you want the tower interior and viewing level.",entry:"Paid tower ticket; the surrounding square is free.",bestTime:"Morning or near sunset"},{id:"istiklal",name:"İstiklal Avenue",district:"Beyoğlu",area:"Beyoğlu",side:"europe",category:"neighborhood",coordinate:{lat:41.0327,lng:28.9777},duration:60,color:"#a89d97",description:"A pedestrian avenue with historic passages, bookshops and Istanbul’s nostalgic red tram.",tip:"Watch for the tram, and explore the quieter side streets. Keep valuables secure when the avenue gets crowded.",entry:"Free street walk; tram rides cost extra.",bestTime:"Late afternoon"},{id:"pera-museum",name:"Pera Museum",district:"Beyoğlu",area:"Pera",side:"europe",category:"museum",coordinate:{lat:41.0319,lng:28.9751},duration:75,color:"#b29aa6",closedDays:[1],description:"Art, Ottoman painting and changing exhibitions in a former grand hotel.",tip:"Closed on Mondays. Temporary exhibitions and opening hours can change; check the entrance board before buying.",entry:"Paid museum entry; concessions may apply.",bestTime:"Afternoon"},{id:"taksim-square",name:"Taksim Square",district:"Beyoğlu",area:"Taksim",side:"europe",category:"landmark",coordinate:{lat:41.0369,lng:28.985},duration:30,color:"#aaa397",description:"A major meeting point at the upper end of İstiklal, beside the Republic Monument.",tip:"The M2 metro and F1 funicular connect here. Use designated pedestrian crossings around the square.",entry:"Free public square.",bestTime:"Late afternoon"},{id:"istanbul-modern",name:"Istanbul Modern",district:"Beyoğlu",area:"Karaköy",side:"europe",category:"museum",coordinate:{lat:41.0261,lng:28.9851},duration:90,color:"#96a4af",closedDays:[1],description:"Modern and contemporary art in a waterfront building designed by Renzo Piano.",tip:"Closed on Mondays. Check exhibition access and bag rules at the entrance; the surrounding waterfront is pleasant for a break.",entry:"Paid museum entry; current exhibitions can differ.",bestTime:"Midday"},{id:"kadikoy-market",name:"Kadıköy Market",district:"Kadıköy",area:"Kadıköy",side:"asia",category:"market",coordinate:{lat:40.99,lng:29.0254},duration:75,color:"#b59577",description:"A lively neighbourhood market of fishmongers, delis, fruit stalls and Turkish comfort food.",tip:"Come hungry and choose a lokanta with clearly displayed prices. Individual shops set their own hours.",entry:"Free area walk; food purchases are extra.",bestTime:"Lunch"},{id:"bahariye-street",name:"Bahariye Street",district:"Kadıköy",area:"Kadıköy",side:"asia",category:"neighborhood",coordinate:{lat:40.9878,lng:29.0289},duration:40,color:"#b49f91",description:"Kadıköy’s pedestrian shopping street, with bookstores and the nostalgic circular tram.",tip:"Watch for the T3 tram on the shared street. The route is compact enough to explore on foot.",entry:"Free street walk.",bestTime:"Afternoon"},{id:"moda",name:"Moda neighbourhood",district:"Kadıköy",area:"Moda",side:"asia",category:"neighborhood",coordinate:{lat:40.9818,lng:29.0257},duration:60,color:"#98aa9c",description:"Calm residential streets, independent cafés and a relaxed local atmosphere.",tip:"Take a café break and keep noise low on residential streets. The waterfront path is a short walk downhill.",entry:"Free area walk; café stops are extra.",bestTime:"Afternoon"},{id:"sureyya-opera",name:"Süreyya Opera House",district:"Kadıköy",area:"Bahariye",side:"asia",category:"landmark",coordinate:{lat:40.987,lng:29.0292},duration:20,color:"#b89595",description:"An elegant 1920s opera-house façade on Kadıköy’s main pedestrian street.",tip:"This stop is for the exterior. Interior access requires a performance ticket or an announced event; do not assume walk-in tours.",entry:"Free exterior view; performances require a ticket.",bestTime:"During the Bahariye walk"},{id:"moda-pier",name:"Moda Pier & waterfront",district:"Kadıköy",area:"Moda",side:"asia",category:"viewpoint",coordinate:{lat:40.9784,lng:29.0252},duration:45,color:"#82a5b5",description:"Sea air, a historic pier and a wide shoreline path looking across the Sea of Marmara.",tip:"Wear comfortable shoes and bring a layer on windy days. The route covers the public waterfront; pier interior hours can vary.",entry:"Free waterfront access.",bestTime:"Sunset"},{id:"fenerbahce-park",name:"Fenerbahçe Park",district:"Kadıköy",area:"Fenerbahçe",side:"asia",category:"park",coordinate:{lat:40.967,lng:29.033},duration:60,color:"#91ac96",description:"A green headland with shaded gardens and expansive sea views.",tip:"It is farther from Kadıköy’s centre: choose this stop when you want a longer coastal walk or a short taxi ride.",entry:"Free public park.",bestTime:"Afternoon or sunset"},{id:"haydarpasa-viewpoint",name:"Haydarpaşa waterfront view",district:"Kadıköy",area:"Kadıköy",side:"asia",category:"viewpoint",coordinate:{lat:40.9965,lng:29.0213},duration:30,color:"#aaa596",description:"See the historic railway station across the waterfront from Kadıköy’s public promenade.",tip:"The station itself can be restricted during restoration. Stay on the public promenade; this stop does not promise station entry.",entry:"Free exterior viewpoint.",bestTime:"Morning or sunset"},{id:"yogurtcu-park",name:"Yoğurtçu Park",district:"Kadıköy",area:"Moda",side:"asia",category:"park",coordinate:{lat:40.9835,lng:29.0358},duration:35,color:"#90a98b",description:"A neighbourhood park by the creek, with walking paths and local everyday life.",tip:"A low-key pause between Bahariye and the coast. Use lit public paths after dark.",entry:"Free public park.",bestTime:"Daylight hours"},{id:"dolmabahce-palace",name:"Dolmabahçe Palace",district:"Beşiktaş",area:"Beşiktaş",side:"europe",category:"museum",coordinate:{lat:41.0391,lng:29.0006},duration:120,color:"#b7ad93",closedDays:[1],description:"An ornate 19th-century Ottoman palace directly on the Bosphorus.",tip:"Closed on Mondays. Arrive early for security and ticket queues; photography and interior touring rules are set by the palace.",entry:"Paid palace ticket; check the sections included.",bestTime:"At opening time"},{id:"besiktas-market",name:"Beşiktaş market streets",district:"Beşiktaş",area:"Beşiktaş",side:"europe",category:"food",coordinate:{lat:41.0431,lng:29.0058},duration:60,color:"#ad947b",description:"Busy local streets with breakfast cafés, fish restaurants and neighbourhood shops.",tip:"A useful lunch stop near the ferry pier. Breakfast streets get crowded at weekends; check prices before ordering.",entry:"Free area walk; meals are extra.",bestTime:"Breakfast or lunch"},{id:"yildiz-park",name:"Yıldız Park",district:"Beşiktaş",area:"Yıldız",side:"europe",category:"park",coordinate:{lat:41.0488,lng:29.0151},duration:60,color:"#89a186",description:"Hilly wooded paths, gardens and quiet corners above the Bosphorus.",tip:"Expect steep sections. Stick to the signed public paths; the park and palace complex have different entrances.",entry:"Free public park; cafés charge separately.",bestTime:"Daylight hours"},{id:"ortakoy",name:"Ortaköy waterfront",district:"Beşiktaş",area:"Ortaköy",side:"europe",category:"viewpoint",coordinate:{lat:41.0473,lng:29.027},duration:60,color:"#97a7b1",description:"The famous waterside mosque, bridge views and stalls selling kumpir and waffles.",tip:"The square is open; ered to personalized cards, such as eligible transfer discounts or holiday travel.","Keep some Turkish lira as a backup. Do not assume every machine accepts your bank card or gives change.","Fares and card availability can change. The machine or station display is the final price; route prices in this app are planning estimates."],sourceUrl:"https://www.istanbulkart.istanbul/",sourceLabel:"Official Istanbulkart website"},{id:"metro-tram",title:"Find your way by rail",subtitle:"A simple way to avoid traffic",steps:["For Sultanahmet, Gülhane, Eminönü and Karaköy, look for the T1 tram. The signs show the final destination, so check your direction before boarding.","Use M2 for central stops including Taksim and Şişhane. F1 links Taksim with Kabataş; the stations at each end connect you to other routes.","Follow the route color and line code, then check the platform destination. Onboard displays and announcements identify the next stop.","When changing lines, follow transfer signs and allow time for walks, stairs and a possible second gate. Each operator or transfer can have separate fare rules."],tips:["Prefer rail during busy road traffic. The estimated journey time includes walking to the station, so a nearby direct tram can be better than a distant metro.","Operating hours, accessibility and service disruptions vary by line. Check station displays before starting a late journey."],sourceUrl:"https://www.metro.istanbul/",sourceLabel:"Official Metro Istanbul website"},{id:"marmaray",title:"Cross the Bosphorus with Marmaray",subtitle:"An underground connection between continents",steps:["From the historic European center, head to Sirkeci station. For the Asian side, follow the eastbound direction toward Gebze; Üsküdar and Ayrılık Çeşmesi are useful stops along the way. Confirm your stop and train destination on the display.","Üsküdar is useful for its waterfront. Ayrılık Çeşmesi connects to the M4 metro, which serves Kadıköy and Sabiha Gökçen Airport.","Have enough credit before entering: Marmaray uses a distance-based fare system and the entry deduction can be higher than the fare for your short journey.","After exiting, look for refund-machine instructions. Refunds and eligibility depend on the card type and current rules; a visitor or anonymous card may not qualify."],tips:["A ferry is a scenic alternative when its departure point and timetable suit your trip. Marmaray is often practical when road traffic is heavy.","The Bosphorus rail crossing has no view of the water. Save a waterfront walk or ferry ride for the scenery."],sourceUrl:"https://marmaray.gov.tr/",sourceLabel:"Official Marmaray website"},{id:"ferries",title:"Let the ferry be part of the visit",subtitle:"Waterfront piers, city views and an easy crossing",steps:["Look for Şehir Hatları piers at Eminönü, Karaköy, Beşiktaş, Üsküdar or Kadıköy. Different piers can serve different destinations, even on the same waterfront.","Read the destination and departure time on the pier display before tapping through. Choose the next suitable sailing and leave time to walk to the correct pier.","Follow the boarding queue and keep your card ready. Most regular city services accept Istanbulkart; sightseeing cruises and private services can use different tickets.","On arrival, use the pier name to confirm where you are before following the next walking leg."],tips:["Wind and weather can disrupt sailings. Check the pier display for cancellations before relying on a connection.","Departures vary by route, day and season. A waterfront pier can have several entrances, so leave time to find the right one."],sourceUrl:"https://sehirhatlari.istanbul/",sourceLabel:"Official Şehir Hatları website"},{id:"taxi",title:"Take a taxi with a clear plan",subtitle:"Useful for luggage or a difficult final stretch",steps:["Use a licensed taxi from an official rank or a reputable booking service. Check the vehicle and driver details when booking.","Show the destination name and map pin before the journey. Ask the driver to use the meter and confirm how you will pay.","Pay in Turkish lira and request a receipt. Check your notes when handing over cash; agree on any payment issue before setting off.","Keep extra time and budget for traffic. Bridge, tunnel or road tolls may add to the meter total, and different taxi classes have different tariffs."],tips:["The app gives an indicative range, never a guaranteed taxi quote. A longer wait in traffic can increase the fare.","For a cross-Bosphorus trip, compare Marmaray or a direct ferry before choosing a taxi."],sourceUrl:"https://tuhim.ibb.gov.tr/",sourceLabel:"Official Istanbul transport regulation website"},{id:"bus",title:"Catch a bus with confidence",subtitle:"Match the stop, line and destination",steps:["At the stop, check its name or stop code and the route direction. Stops across the street usually serve the opposite direction.","Match the bus line code and destination display to your journey before boarding. Tap your Istanbulkart on the reader near the entrance.","Use onboard displays or your map to follow the journey. Press the stop button before your stop and leave by the designated exit.","Refresh the arrivals panel for the selected stop. If live arrivals are not connected or the service is stale, no reliable countdown is available."],tips:["Traffic affects bus arrival times. Live predictions are estimates and can change as the vehicle approaches.","Use the stop code printed at the bus stop when looking up arrivals. A neighborhood name may refer to several different stops."],sourceUrl:"https://iett.istanbul/",sourceLabel:"Official IETT website"},{id:"arrival",title:"Start smoothly after landing",subtitle:"Know which airport you are arriving at",steps:["Istanbul Airport (IST) is on the European side. Follow airport signs for public transport; the M11 metro serves the airport, and you may need a transfer for your accommodation.","Sabiha Gökçen Airport (SAW) is on the Asian side. The M4 metro connects the airport to Kadıköy, with a Marmaray transfer at Ayrılık Çeşmesi.","Choose a signed official airport coach or taxi rank if rail does not fit your arrival time, luggage or accommodation. Confirm the current destination and ticket price before boarding.","Save your accommodation name, address and map pin offline. Your first travel day can be shorter after a flight; use a relaxed pace if needed."],tips:["The airports are far apart. Match the airport code on your ticket before planning a transfer.","Airport rail, coaches and taxi prices are separate from the city estimates in this app. Timetables and transfers can change."],sourceUrl:"https://www.metro.istanbul/",sourceLabel:"Official Metro Istanbul website"},{id:"everyday",title:"A few things that make the day easier",subtitle:"Comfort, etiquette and useful essentials",steps:["Wear comfortable shoes: Istanbul has steep streets, uneven paving and long station corridors. Carry drinking water and allow breaks.","For mosque visits, cover shoulders and knees, remove shoes where requested, and bring a head covering if needed. Respect prayer times and follow the visitor signs.","Keep valuables secure in crowded trams, markets and queues. Use the accommodation safe for documents you do not need during the day.","For an urgent medical, fire or police emergency, call 112. Keep your accommodation address and a downloaded copy of your trip accessible."],tips:["Pay in Turkish lira. Check the final amount and currency before accepting a card terminal payment.","Museum entry, reservation requirements and opening hours change. Ticket counters and official venue notices take precedence over a saved itinerary."],sourceUrl:"https://www.112.gov.tr/",sourceLabel:"Official Turkish emergency service website"}],$g=[{title:"Tap, then explore",body:"Get an Istanbulkart at a station Biletmatik machine. Keep enough credit for your next ride and remember that card benefits vary by type."},{title:"Cross without the traffic",body:"Sirkeci to Üsküdar is a usef
